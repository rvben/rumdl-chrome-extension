name: Chrome Web Store Status

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

jobs:
  status:
    if: >-
      ${{
        vars.CWS_EXTENSION_ID != '' &&
        vars.CWS_PUBLISHER_ID != '' &&
        vars.GCP_SERVICE_ACCOUNT != '' &&
        vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        id: google-auth
        # google-github-actions/auth v3.0.0
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore.readonly
          create_credentials_file: false

      - name: Check review and policy status
        id: store-status
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: node scripts/chrome-web-store.mjs status --fail-on-problem true

      - name: Read expected version
        id: expected-version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.store-status.outputs.published_version == steps.expected-version.outputs.version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.store-status.outputs.published_version == steps.expected-version.outputs.version
        run: npm ci

      - name: Install Chromium
        if: steps.store-status.outputs.published_version == steps.expected-version.outputs.version
        run: npx playwright install --with-deps chromium

      - name: Download published store package
        if: steps.store-status.outputs.published_version == steps.expected-version.outputs.version
        run: >-
          node scripts/download-store-extension.mjs
          --extension-id "${{ vars.CWS_EXTENSION_ID }}"
          --output "${{ runner.temp }}/rumdl-store-extension"
          --expected-version "${{ steps.expected-version.outputs.version }}"

      - name: Test published store package
        if: steps.store-status.outputs.published_version == steps.expected-version.outputs.version
        env:
          E2E_EXTENSION_SOURCE: ${{ runner.temp }}/rumdl-store-extension
          E2E_EXTENSION_LABEL: Chrome Web Store package
        run: node tests/e2e/extension.test.mjs

      - name: Record store package validation
        if: steps.store-status.outputs.published_version == steps.expected-version.outputs.version
        run: >-
          echo "- Store-delivered v${{ steps.expected-version.outputs.version }}:
          all real-extension browser tests passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Report review wait
        if: steps.store-status.outputs.published_version != steps.expected-version.outputs.version
        run: >-
          echo "Store package tests are waiting for v${{ steps.expected-version.outputs.version }};
          currently published: ${{ steps.store-status.outputs.published_version || 'none' }}"
